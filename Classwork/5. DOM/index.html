    <!-- DOM = Document Object Model(HTML TREE)
         BOM = Browser Object Model (WINDOWS EVENTS)

    The Document Object Model (DOM) is a programming interface for HTML and XML documents. 
    It represents the structure of a document as a tree-like structure, where each node corresponds to a part of the document, such as an element, text, or comment.  
    
    The Browser Object Model(BOM) is a powerful tool that empowers, Javascript to interact with the browser window, history,navigation, and even user's device.
    By understanding key objects, properties, and methods of the BOM. -->

    <h1 id="head">Hello JS</h1>
    <h1 class="hello">Hello JS</h1>
    <h1>Hello JS</h1>
    <h1>Hello JS</h1>

    <p class="hello">Lorem ipsum dolor sit amet.</p>

</body>
