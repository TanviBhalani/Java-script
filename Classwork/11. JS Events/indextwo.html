<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Slider with Buttons</title>
  <style>
    #slider {
      width: 400px;
      height: 300px;
      object-fit: cover;
      border: 2px solid #ccc;
    }
    #controls {
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>Image Slider</h2>
  <img id="slider" src="" alt="Image Slider">
  
  <div id="controls">
    <button onclick="prevImage()">Previous</button>
    <button onclick="nextImage()">Forward</button>
  </div>

  <script>
    const arr = [
      'one.jpeg',
      'two.jpeg',
      'three.jpeg',
      'Untitled.jpeg'
    ];

    let i = 0;
    const img = document.getElementById('slider');

    // Function to update the image source
    function magic() {
      img.src = arr[i];
    }

    // Show next image
    function nextImage() {
      if (i < arr.length - 1) {
        i++;
      } else {
        i = 0;
      }
      magic();
    }

    // Show previous image
    function prevImage() {
      if (i > 0) {
        i--;
      } else {
        i = arr.length - 1;
      }
      magic();
    }

    // Initialize with first image
    magic();
  </script>

</body>
</html>
