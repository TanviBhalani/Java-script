<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 650px;
    }

    #counter {
      font-size: 2rem;
      text-align: center;
      width: 100px;
      margin-bottom: 20px;
    }
    .box{
      width: 300px;
      height: 150px;
      background-color: antiquewhite;
      padding: 20px;
    }
    button {
      font-size: 1.2rem;
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #a4a2a2;
    }

    .plus {
      background-color: #4CAF50;
      color: white;
    }

    .minus {
      background-color: #f44336;
      color: white;
    }

    .reset {
      background-color: #2196F3;
      color: white;
    }
  </style>
</head>
<body>

  <h1 style="text-align: center;">Number Counter</h1>

 <div class="box">
   <input type="number" id="counter" value="0" style="margin-left: 90px; border-radius: 10px; padding-left: 6px;" readonly>

  <div style="margin-left: 35px;">
    <button class="minus" onclick="minus()">-</button>
    <button class="reset" onclick="restart()">Reset</button>
    <button class="plus" onclick="plus()">+</button>
    
  </div>
 </div>

  <script>
    function plus(){
      document.getElementById("counter").value =
        document.getElementById("counter").valueAsNumber + 1;
    }

    function minus(){
      document.getElementById("counter").value =
        document.getElementById("counter").valueAsNumber - 1;
    }

    function restart(){
      document.getElementById("counter").value = 0;
    }
  </script>

</body>
</html>
