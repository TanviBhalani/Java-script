<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Key Display Box</title>
</head>
<body>
    <style>
        body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f0f0f0;
  font-family: sans-serif;
}

.box {
  background: #fff;
  padding: 40px 60px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  font-size: 24px;
  font-weight: bold;
  color: #333;
  transition: all 0.2s ease;
}


    </style>

  <div class="box">Press any key...</div>


<script>
const box = document.querySelector(".box");

document.addEventListener("keydown", (event) => {
box.textContent = "You pressed: " + event.key;
});



  </script>

</body>
</html>
