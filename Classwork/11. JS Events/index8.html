<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Selector</title>
</head>
<body>
    <style>
        body {
  font-family: Arial, sans-serif;
  height: 550px;
}

.container {
  background: #fff;
  padding: 20px 30px;
  border-radius: 10px;
  width: 300px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.label {
  display: flex;
  align-items: center;
}

.icon {
  font-size: 24px;
  margin-right: 10px;
}

.title {
  font-weight: bold;
  font-size: 16px;
}

.subtitle {
  font-size: 12px;
  color: #666;
}

.counter {
  display: flex;
  align-items: center;
}

.counter button {
  background: #2196f3;
  color: white;
  border: none;
  font-size: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
}

.counter span {
  margin: 0 10px;
  font-size: 18px;
  font-weight: bold;
}

    </style>



<h1 style="text-align: center;margin-top: 150px;">Passenger Selector</h1>
  <div class="main" style="width: 400px; height: 250px; background-color: #2196f3; padding-left: 45px;padding-top: 45px; margin-left:550px ;">
    <div class="container">
    <!-- Adults -->
    <div class="row">
      <div class="label">
        <svg xmlns="http://www.w3.org/2000/svg" width="21.88" height="35" viewBox="0 0 320 512" style="margin-right: 24px;"><path fill="#3a3f97" d="M112 48a48 48 0 1 1 96 0a48 48 0 1 1-96 0m40 304v128c0 17.7-14.3 32-32 32s-32-14.3-32-32V256.9l-28.6 47.6c-9.1 15.1-28.8 20-43.9 10.9s-20-28.8-10.9-43.9l58.3-97c17.4-28.9 48.6-46.6 82.3-46.6h29.7c33.7 0 64.9 17.7 82.3 46.6l58.3 97c9.1 15.1 4.2 34.8-10.9 43.9s-34.8 4.2-43.9-10.9L232 256.9V480c0 17.7-14.3 32-32 32s-32-14.3-32-32V352z"/></svg>
        <div>
          <div class="title">Adults</div>
          <div class="subtitle">16+ years</div>
        </div>
      </div>
      <div class="counter">
        <button onclick="decrease('adult')">−</button>
        <input type="text" id="adult" value="2" readonly style="width: 35px; height: 20px; outline: none; margin-left: 5px; margin-right: 5px;margin-left: 20px; border: none; font-size: 20px;"/>
        <button onclick="increase('adult')">+</button>
      </div>
    </div>

    <!-- Children -->
    <div class="row">
      <div class="label">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 48 48" style="margin-right: 15px;"><g fill="#3a3f97"><path d="M17.8 13.734a3.734 3.734 0 1 1-7.466 0a3.734 3.734 0 0 1 7.467 0"/><path fill-rule="evenodd" d="M9.696 25.995a2 2 0 0 1-3.392-2.12l.004-.006l.007-.011l.024-.038a20 20 0 0 1 .391-.593a25 25 0 0 1 1.022-1.4c.399-.504.889-1.073 1.407-1.535c.259-.231.571-.477.924-.675c.332-.186.851-.416 1.486-.416h4.996c.635 0 1.154.23 1.487.416c.352.198.665.444.923.675c.518.462 1.009 1.031 1.407 1.536a25 25 0 0 1 1.413 1.992l.025.038l.007.01l.003.006s-.035-.054 0 0a2 2 0 0 1-3.391 2.121l-.003-.004l-.016-.025l-.152-.235v2.484l.723 7.595a2 2 0 0 1-3.97.473L14 29.143l-1.02 7.14a2 2 0 0 1-3.971-.473l.84-8.81h.018v-1.27l-.153.236l-.015.025z" clip-rule="evenodd"/><path d="M37.8 13.733a3.733 3.733 0 1 1-7.467 0a3.733 3.733 0 0 1 7.467 0"/><path fill-rule="evenodd" d="M29.701 25.785a2 2 0 0 1-3.402-2.103l.003-.006l.008-.011l.023-.038l.085-.134a26 26 0 0 1 1.313-1.858c.394-.504.88-1.074 1.392-1.537c.257-.231.567-.479.918-.677c.33-.188.85-.421 1.488-.421h4.942c.638 0 1.158.233 1.489.42c.35.2.66.447.917.678c.513.463.998 1.033 1.392 1.537a25 25 0 0 1 1.398 1.991l.024.039l.01.017a2 2 0 0 1-3.402 2.104l-.003-.005l-.015-.025l-.066-.103a22 22 0 0 0-.399-.6c.468 2.331 1.39 5.526 1.872 7.143a.99.99 0 0 1-.738 1.26c-3.537.737-6.013.718-9.854-.014a1 1 0 0 1-.76-1.28c.505-1.624 1.444-4.786 1.889-7.168a24 24 0 0 0-.506.762l-.015.025zm-.101 9.367V36.5a1.5 1.5 0 0 0 2.948.39l.395-1.464a36 36 0 0 1-3.343-.274m5.655.27l.397 1.469A1.5 1.5 0 0 0 38.6 36.5v-1.362a38 38 0 0 1-3.345.283" clip-rule="evenodd"/></g></svg>
        <div>
          <div class="title">Children</div>
          <div class="subtitle">2-15 years</div>
        </div>
      </div>
      <div class="counter">
        <button onclick="decrease('child')">−</button>
        <input type="text" id="child" value="0" readonly style="width: 35px; height: 20px; outline: none; margin-left: 5px; margin-right: 5px;margin-left: 20px; border: none; font-size: 20px;"/>
        <button onclick="increase('child')">+</button>
      </div>
    </div>

    <!-- Infants -->
    <div class="row">
      <div class="label">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" style="margin-right: 15px;"><path fill="#3a3f97" fill-rule="evenodd" d="M3.682 12.317a8.7 8.7 0 0 0 3.74 5.54a6.78 6.78 0 0 0-1.91 4.71c0 .41.34.75.75.75s.75-.34.75-.75c0-1.5.65-2.94 1.78-3.94v-.02c1.06.46 2.23.71 3.45.71s2.39-.25 3.45-.71l.02.02c1.13 1 1.78 2.44 1.78 3.94c0 .41.34.75.75.75s.75-.34.75-.75c0-1.76-.69-3.44-1.91-4.71a8.72 8.72 0 0 0 3.74-5.54c1.2-.04 2.17-1.01 2.17-2.25s-1.01-2.25-2.25-2.25h-.19c-1.14-3.58-4.46-6.01-8.29-6.01a8.71 8.71 0 0 0-8.31 6.01h-.19c-1.24 0-2.25 1.03-2.25 2.25s.96 2.21 2.17 2.25m1.03-1.48a.7.7 0 0 0-.4-.12h.02c-.09.01-.17.02-.25.05c-.6.21-1.05-.19-1.05-.69a.755.755 0 0 1 1.09-.67c.2.11.45.13.67.03s.38-.29.43-.52a7.21 7.21 0 0 1 7.03-5.6c.57 0 1.25.56 1.25 1.25s-.68 1.25-1.25 1.25c-.35 0-.77-.14-1.04-.35a.749.749 0 1 0-.91 1.19c.54.41 1.27.65 1.96.65h-.01c1.46 0 2.75-1.28 2.75-2.74c0-.27-.04-.54-.13-.79c2.2.83 3.91 2.71 4.47 5.13c.05.23.21.43.43.52c.21.1.46.09.67-.03a.755.755 0 0 1 1.09.67c0 .5-.46.9-1.05.69a.74.74 0 0 0-.65.07c-.2.12-.32.32-.35.55a7.25 7.25 0 0 1-7.21 6.43c-3.7 0-6.8-2.76-7.21-6.43a.77.77 0 0 0-.35-.55zm5.8 3.73c0 .96.79 1.75 1.75 1.75s1.75-.79 1.75-1.75c0-.41-.34-.75-.75-.75h-2c-.41 0-.75.34-.75.75m-1.25-2.99c-.55 0-1-.45-1-1s.45-1 1-1s1 .44 1 1s-.45 1.01-1 1.01zm5-1c0 .55.45 1 1 1c.55.01 1-.44 1-1s-.45-1-1-1s-1 .45-1 1" color="#3a3f97"/></svg>
        <div>
          <div class="title">Infants</div>
          <div class="subtitle">Under 2</div>
        </div>
      </div>
      <div class="counter">
        <button onclick="decrease('infant')">−</button>
        <input type="text" id="infant" value="1" readonly style="width: 35px; height: 20px; outline: none; margin-left: 5px; margin-right: 5px; margin-left: 20px; border: none; font-size: 20px;"/>
        <button onclick="increase('infant')">+</button>
      </div>
    </div>
  </div>
  </div>

  <script>

    function increase(type) {
  let input = document.getElementById(type);
  let value = parseInt(input.value);
  input.value = value + 1;
}

function decrease(type) {
  let input = document.getElementById(type);
  let value = parseInt(input.value);
  if (value > 0) {
    input.value = value - 1;
  }
}

  </script>

</body>
</html>
