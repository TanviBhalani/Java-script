<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Box</title>
</head>
<body>

<style>
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 600px;
  background: #f7f7f7;
  font-family: sans-serif;
}

.box {
  height: 200px;
  width: 200px;
  background: pink;
  border: 1px solid #333;
  transition: all 0.45s ease;
  margin-bottom: 20px;
}

input {
  padding: 10px 15px;
  font-size: 16px;
  border: 1px solid #333;
  border-radius: 5px;
  width: 220px;
  text-align: center;
}

</style>

  <div class="box"></div>
  <input type="text" placeholder="Type color or border-radius..." />



  <script>

const box = document.querySelector(".box");
const input = document.querySelector("input");

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    const value = input.value.trim();

    // Check if it's a border-radius value
    if (value.endsWith("px") || value.endsWith("%")) {
      box.style.borderRadius = value;
    } else {
      box.style.background = value;
    }

    input.value = ""; // Clear input after applying
  }
});


  </script>
</body>
</html>
