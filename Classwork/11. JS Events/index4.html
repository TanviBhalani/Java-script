<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor pointer</title>
  
</head>
<body>
    <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #ball {
      width: 20px;
      height: 20px;
      background: blue;
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      display: none;
    }

    .btn {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    #startBtn {
      background-color: #2ecc71; /* green */
    }

    #stopBtn {
      background-color: #e74c3c; /* red */
    }
  </style>

    <h2>Cursor Ball Tracker</h2>
    <button id="startBtn" class="btn">Start Ball Follow</button>
    <button id="stopBtn" class="btn">Stop Ball Follow</button>

    <div id="ball"></div>



<script>
  const ball = document.getElementById("ball");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const radius = 10;
  let isTracking = false;

  // Start button activates tracking
  startBtn.onclick = () => {
    isTracking = true;
    ball.style.display = "block";
  };

  // Stop button disables tracking
  stopBtn.onclick = () => {
    isTracking = false;
    ball.style.display = "none";
  };

  // Move the ball with mouse if tracking is active
  onmousemove = e => {
    if (!isTracking) return;
    ball.style.left = (e.pageX - radius) + "px";
    ball.style.top = (e.pageY - radius) + "px";
  };
</script>

</body>
</html>
