<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <section id="header" style="top: 0px;">
        <a href="#"><img src="./images/cara black logo.png" class="logo" alt="" style="width: 100px;"></a>
        <div>
            <ul id="navbar">
                <li><a class="active" href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                 <li><a href="cart.html">
                     <i class="fas fa-shopping-bag" style="color: #494a4b;"></i>
                     <span id="cart-count" style="
                        position: absolute;
                        top: -8px;
                        right: -10px;
                        background: rgb(71, 70, 70);
                        color: white;
                        padding-left: -3px;
                        font-size: 12px;
                        border-radius: 50%;
                        padding: 2px 6px;
                        line-height: 1;">
                    </span>
                </a></li>

            </ul>
        </div>
    </section>

    <section style="margin: 40px; margin-top: 100px;">
    <table>
      <thead>
        <tr>
          <th>Remove</th>
          <th>Image</th>
          <th>Product</th>
          <th>Size</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="cart-body">
        <!-- Cart items inserted here -->
      </tbody>
    </table>
    <h2 id="grand-total">Total: ₹0.00</h2>

    <div class="checkout-btn">
      <button onclick="checkout()">Checkout</button>
    </div>
  </section> 


<script>
    let cartItems = JSON.parse(localStorage.getItem("cartItems")) || [];

    function renderCart() {
      const tbody = document.getElementById("cart-body");
      const totalEl = document.getElementById("grand-total");
      tbody.innerHTML = "";
      let total = 0;

      if (cartItems.length === 0) {
        tbody.innerHTML = `<tr><th colspan="7">Your cart is empty.</th></tr>`;
        totalEl.textContent = "Total: ₹0.00";
        updateCartCount();
        return;
      }

      cartItems.forEach((item, index) => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span class="remove-btn" onclick="removeItem(${index})">×</span></td>
          <td><img src="${item.image}" alt="Product"></td>
          <td>${item.name}</td>
          <td>${item.size}</td>
          <td>₹${item.price}</td>
          <td><input type="number" min="1" value="${item.quantity}" onchange="updateQty(${index}, this.value)" /></td>
          <td>₹${subtotal.toFixed(2)}</td>
        `;
        tbody.appendChild(row);
      });

      totalEl.textContent = `Total: ₹${total.toFixed(2)}`;
      updateCartCount();
    }

    function removeItem(index) {
      cartItems.splice(index, 1);
      localStorage.setItem("cartItems", JSON.stringify(cartItems));
      localStorage.setItem("cartCount", cartItems.length);
      renderCart();
    }

    function updateQty(index, newQty) {
      const qty = parseInt(newQty);
      if (qty > 0) {
        cartItems[index].quantity = qty;
        localStorage.setItem("cartItems", JSON.stringify(cartItems));
        renderCart();
      }
    }

    function checkout() {
      alert("Thank you for your order!");
      localStorage.removeItem("cartItems");
      localStorage.setItem("cartCount", "0");

      cartItems = [];

      renderCart();
    }

    // cart count:
    function updateCartCount() {
      const count = cartItems.length;
      const cartCountElem = document.getElementById("cart-count");
      if (cartCountElem) {
        cartCountElem.textContent = count;
      }
    }

    renderCart();
</script>
    
</body>
</html>
