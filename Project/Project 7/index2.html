<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
   
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 50px;
      background-color: #f9f9f9;
    }

    #quote {
      font-size: 24px;
      font-weight: 500;
      color: #333;
      padding: 20px;
      margin: 30px auto;
      max-width: 600px;
      border: 2px solid #ccc;
      border-radius: 12px;
      background-color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    #controls {
      margin-top: 20px;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
    }
</style>

</head>
<body>


    <div id="quote">Loading quote...</div>

    <div id="controls" >
        <button onclick="prevQuote()"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6L2 16l8 10M2 16h28"/></svg></button>
        <button onclick="nextQuote()"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m22 6l8 10l-8 10m8-10H2"/></svg></button>
    </div>

<script>
    
const quotes = [
    "Believe you can and you're halfway there.",
    "Don't watch the clock; do what it does. Keep going.",
    "The future depends on what you do today.",
    "Success is not in what you have, but who you are.",
    "Push yourself, because no one else is going to do it for you.",
    "Dream it. Wish it. Do it.",
    "Stay positive, work hard, and make it happen."
];

let i = 0;
const quoteBox = document.getElementById('quote');

function showQuote() {
    quoteBox.textContent = quotes[i];
}

function nextQuote() {
    i = (i + 1) % quotes.length;
    showQuote();
}

function prevQuote() {
    i = (i - 1 + quotes.length) % quotes.length;
    showQuote();
}

setInterval(() => {
      nextQuote();
    }, 4000);

 showQuote();

</script>
    
</body>
</html>
